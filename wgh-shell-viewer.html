<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wilhelm Global Holdings — The Shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Jost:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #07090d;
    --frost: #e8edf2;
    --champagne: #c9a961;
    --champagne-dim: rgba(201, 169, 97, 0.35);
    --steel: #5c7a99;
    --plate: rgba(11, 14, 19, 0.78);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--void);
    font-family: 'Jost', sans-serif;
    color: var(--frost);
  }

  #scene {
    position: fixed;
    inset: 0;
    display: block;
  }

  /* ---------- Loading veil ---------- */
  #veil {
    position: fixed;
    inset: 0;
    background: var(--void);
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    transition: opacity 1.4s ease, visibility 1.4s;
  }
  #veil.lifted { opacity: 0; visibility: hidden; }

  .veil-mark {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.1rem, 2.4vw, 1.6rem);
    font-weight: 500;
    letter-spacing: 0.55em;
    text-indent: 0.55em;
    color: var(--frost);
    opacity: 0;
    animation: breathe 2.8s ease-in-out infinite;
  }
  .veil-sub {
    font-size: 0.62rem;
    font-weight: 300;
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    text-transform: uppercase;
    color: var(--champagne);
    opacity: 0;
    animation: breathe 2.8s ease-in-out 0.3s infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }
  .veil-line {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--champagne), transparent);
    position: relative;
    overflow: hidden;
  }
  .veil-line::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, var(--frost), transparent);
    transform: translateX(-100%);
    animation: sweep 1.8s ease-in-out infinite;
  }
  @keyframes sweep {
    to { transform: translateX(100%); }
  }

  /* ---------- Interface plates ---------- */
  .ui {
    position: fixed;
    z-index: 10;
    opacity: 0;
    transition: opacity 1.6s ease 0.6s;
  }
  body.revealed .ui { opacity: 1; }

  #wordmark {
    top: 34px;
    left: 38px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
  }
  #wordmark .name {
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.42em;
    color: var(--frost);
  }
  #wordmark .division {
    font-size: 0.56rem;
    font-weight: 300;
    letter-spacing: 0.46em;
    text-transform: uppercase;
    color: var(--champagne);
  }

  /* Builder's plate — engraved specification card */
  #builders-plate {
    bottom: 38px;
    left: 38px;
    background: var(--plate);
    border: 1px solid rgba(201, 169, 97, 0.22);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 20px 26px 18px;
    min-width: 230px;
    pointer-events: none;
  }
  #builders-plate::before {
    content: '';
    position: absolute;
    inset: 5px;
    border: 1px solid rgba(201, 169, 97, 0.12);
    pointer-events: none;
  }
  #builders-plate .plate-title {
    font-family: 'Cinzel', serif;
    font-size: 0.74rem;
    font-weight: 500;
    letter-spacing: 0.34em;
    color: var(--champagne);
    margin-bottom: 13px;
  }
  #builders-plate .row {
    display: flex;
    justify-content: space-between;
    gap: 30px;
    font-size: 0.6rem;
    font-weight: 300;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 4px 0;
    border-top: 1px solid rgba(232, 237, 242, 0.07);
  }
  #builders-plate .row span:first-child { color: rgba(232, 237, 242, 0.45); }
  #builders-plate .row span:last-child { color: var(--frost); }

  /* Controls hint */
  #hint {
    bottom: 38px;
    right: 38px;
    text-align: right;
    font-size: 0.58rem;
    font-weight: 300;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(232, 237, 242, 0.38);
    line-height: 2.1;
    pointer-events: none;
  }
  #hint em {
    font-style: normal;
    color: var(--champagne-dim);
  }

  /* Frost vignette */
  #vignette {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center, transparent 52%, rgba(7, 9, 13, 0.55) 100%),
      linear-gradient(180deg, rgba(7, 9, 13, 0.35) 0%, transparent 18%, transparent 82%, rgba(7, 9, 13, 0.5) 100%);
  }

  @media (max-width: 640px) {
    #wordmark { top: 24px; left: 22px; }
    #builders-plate { bottom: 22px; left: 22px; min-width: 0; padding: 15px 18px 13px; }
    #hint { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .veil-mark, .veil-sub { animation: none; opacity: 1; }
    .veil-line::after { animation: none; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="vignette"></div>

<div id="veil">
  <div class="veil-mark">WILHELM GLOBAL HOLDINGS</div>
  <div class="veil-line"></div>
  <div class="veil-sub">Unveiling the Shell</div>
</div>

<div class="ui" id="wordmark">
  <div class="name">WILHELM GLOBAL HOLDINGS</div>
  <div class="division">Engineering Division &mdash; Est. 1947</div>
</div>

<div class="ui" id="builders-plate">
  <div class="plate-title">BUILDER'S PLATE</div>
  <div class="row"><span>Designation</span><span>The Shell</span></div>
  <div class="row"><span>Series</span><span>Ark Class</span></div>
  <div class="row"><span>Hull</span><span>Rough Metal</span></div>
  <div class="row"><span>Condition</span><span>Frost-Sealed</span></div>
  <div class="row"><span>Works No.</span><span>WGH-001</span></div>
</div>

<div class="ui" id="hint">
  <em>Drag</em> to orbit<br>
  <em>Scroll</em> to approach<br>
  <em>Right-drag</em> to glide
</div>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Renderer ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* ---------- Scene & atmosphere ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07090d);
scene.fog = new THREE.FogExp2(0x0a0e15, 0.016);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------- Camera ---------- */
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 2000);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = !reducedMotion;
controls.autoRotateSpeed = 0.55;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = Math.PI / 2 + 0.08;

/* ---------- Lighting: showroom unveiling ---------- */
// Champagne key light — the warm reveal
const key = new THREE.DirectionalLight(0xe8c585, 2.6);
key.position.set(60, 80, 40);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
scene.add(key);

// Arctic fill — the frozen world outside
const fill = new THREE.DirectionalLight(0x7a96b8, 0.9);
fill.position.set(-70, 30, -50);
scene.add(fill);

// Cold rim from behind, separates hull from the void
const rim = new THREE.DirectionalLight(0xaecde8, 1.4);
rim.position.set(0, 45, -90);
scene.add(rim);

// Low ambient so the darks stay rich, never crushed
scene.add(new THREE.AmbientLight(0x2a3442, 0.55));

// A faint warm lamp under the hull, like platform lighting
const lamp = new THREE.PointLight(0xc9a961, 0.6, 120, 1.8);
scene.add(lamp);

/* ---------- Load GLB from separate file ---------- */
const loader = new GLTFLoader();
const veilSub = document.querySelector('.veil-sub');

loader.load(
  './wgh-shell.glb',
  (gltf) => {
    const model = gltf.scene;

    // Strip all color — uniform raw steel across every material
    const steelColor = new THREE.Color(0x8a9aaa);
    model.traverse((node) => {
      if (!node.isMesh) return;
      node.castShadow = true;
      node.receiveShadow = true;
      const m = node.material;
      if (!m) return;
      m.color = steelColor.clone();
      m.metalness = 0.90;
      m.roughness = 0.28;
      m.envMapIntensity = 1.6;
      m.needsUpdate = true;
    });

    // Rotate so the shell faces up
    model.rotation.x = Math.PI / 2;

    // Center and frame
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    model.position.sub(center);
    scene.add(model);

    const maxDim = Math.max(size.x, size.y, size.z);
    const dist = maxDim / (2 * Math.tan((camera.fov * Math.PI) / 360));

    camera.position.set(dist * 0.62, maxDim * 0.16, dist * 0.5);
    camera.near = maxDim / 1000;
    camera.far = maxDim * 12;
    camera.updateProjectionMatrix();

    controls.target.set(0, 0, 0);
    controls.minDistance = maxDim * 0.12;
    controls.maxDistance = dist * 1.6;
    controls.update();

    // Platform lamp beneath the hull
    lamp.position.set(0, -size.y * 0.5 - 2, 0);
    lamp.distance = maxDim * 0.6;

    // Ground plane — dark ice sheet catching the shadow
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(maxDim * 1.4, 64),
      new THREE.MeshStandardMaterial({
        color: 0x0b0f15,
        metalness: 0.35,
        roughness: 0.65,
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -size.y * 0.5 - 0.05;
    ground.receiveShadow = true;
    scene.add(ground);

    // Adjust fog to model scale
    scene.fog = new THREE.FogExp2(0x0a0e15, 1.6 / maxDim);

    // Lift the veil
    setTimeout(() => {
      document.getElementById('veil').classList.add('lifted');
      document.body.classList.add('revealed');
    }, 900);
  },
  (progress) => {
    if (progress.total) {
      const pct = Math.round((progress.loaded / progress.total) * 100);
      veilSub.textContent = `Loading hull — ${pct}%`;
    }
  },
  (err) => {
    console.error('Model failed to load:', err);
    veilSub.textContent = 'The Shell could not be loaded';
  }
);

/* ---------- Loop ---------- */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
